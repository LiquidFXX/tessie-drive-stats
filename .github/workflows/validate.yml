name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Compile integration
        run: python -m compileall -q custom_components/tessie_drive_stats

      - name: Run tests
        run: python -m pytest -q
