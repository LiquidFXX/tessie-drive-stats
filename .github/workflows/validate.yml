name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation tools
        run: python -m pip install --upgrade pytest ruff

      - name: Compile integration
        run: python -m compileall -q custom_components/tessie_drive_stats

      - name: Check undefined names
        run: python -m ruff check --select F821 custom_components/tessie_drive_stats tests

      - name: Validate bundled dashboard card JavaScript
        run: node --check custom_components/tessie_drive_stats/www/tessie-drive-stats-card.js

      - name: Run tests
        run: python -m pytest -q
